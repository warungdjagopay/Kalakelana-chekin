<!DOCTYPE html><html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Kala Kelana Check-in</title>  <script src="https://unpkg.com/html5-qrcode"></script>  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f2eb;
      margin: 0;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 15px;
      box-sizing: border-box;
    }

    #hasil {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-sizing: border-box;
    }

    .success {
      background: #d4edda !important;
    }

    .error {
      background: #f8d7da !important;
    }

    .loading {
      background: #fff3cd !important;
    }

    .nama {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .paket {
      font-size: 18px;
    }
  </style></head><body>  <h1>KALA KELANA</h1>
  <p class="subtitle">CHECK-IN PESERTA</p>  <div id="reader"></div>  <div id="hasil">
    Silakan scan QR peserta
  </div><script>

// =====================================================
// URL APPS SCRIPT KAMU
// =====================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz1z8XP4sTprKywtNf_L2tJ27E9CB-K8W6ekSouA1FGKjTINLupj-Ily_MGJL2M1hqnHA/exec";


// =====================================================
// VARIABEL
// =====================================================

let sedangProses = false;


// =====================================================
// PROSES QR
// =====================================================

function prosesScan(kode) {

  if (sedangProses) {
    return;
  }

  sedangProses = true;

  const hasil = document.getElementById("hasil");

  hasil.className = "loading";

  hasil.innerHTML =
    "<h2>⏳ MEMERIKSA TIKET...</h2>" +
    "<p>" + kode + "</p>";


  const url =
    APPS_SCRIPT_URL +
    "?kode=" +
    encodeURIComponent(kode);


  fetch(url)
    .then(response => {

      if (!response.ok) {
        throw new Error("Server error " + response.status);
      }

      return response.json();

    })

    .then(data => {

      tampilkanHasil(data);

    })

    .catch(error => {

      console.error(error);

      hasil.className = "error";

      hasil.innerHTML =
        "<h2>❌ TERJADI KESALAHAN</h2>" +
        "<p>Gagal menghubungi sistem check-in.</p>" +
        "<p>Silakan coba scan lagi.</p>";

    })

    .finally(() => {

      setTimeout(() => {

        sedangProses = false;

        hasil.className = "";

        hasil.innerHTML =
          "Silakan scan peserta berikutnya";

      }, 4000);

    });

}


// =====================================================
// MENAMPILKAN HASIL
// =====================================================

function tampilkanHasil(data) {

  const hasil =
    document.getElementById("hasil");


  // CHECK-IN BERHASIL

  if (data.success === true) {

    hasil.className = "success";

    hasil.innerHTML =
      "<h2>✅ CHECK-IN BERHASIL</h2>" +

      "<div class='nama'>" +
      data.nama +
      "</div>" +

      "<div class='paket'>" +
      "Package: <b>" +
      data.paket +
      "</b>" +
      "</div>";

    return;
  }


  // TIKET SUDAH DIGUNAKAN

  if (data.type === "USED") {

    hasil.className = "error";

    hasil.innerHTML =
      "<h2>⚠️ TIKET SUDAH DIGUNAKAN</h2>" +

      "<div class='nama'>" +
      data.nama +
      "</div>" +

      "<div class='paket'>" +
      "Package: <b>" +
      data.paket +
      "</b>" +
      "</div>";

    return;
  }


  // TIKET TIDAK DITEMUKAN

  if (data.type === "NOT_FOUND") {

    hasil.className = "error";

    hasil.innerHTML =
      "<h2>❌ TIKET TIDAK DITEMUKAN</h2>" +

      "<p>QR Code tidak terdaftar.</p>";

    return;
  }


  // ERROR LAIN

  hasil.className = "error";

  hasil.innerHTML =
    "<h2>❌ ERROR</h2>" +
    "<p>" +
    (data.message || "Terjadi kesalahan.") +
    "</p>";

}


// =====================================================
// HASIL SCAN QR
// =====================================================

function berhasilScan(decodedText) {

  prosesScan(decodedText);

}


function gagalScan(errorMessage) {

  // Error scanning biasa diabaikan

}


// =====================================================
// AKTIFKAN SCANNER
// =====================================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true
    },

    false

  );


scanner.render(
  berhasilScan,
  gagalScan
);

</script></body>
</html>
